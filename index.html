<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SEYİR Auto</title>
  <script src="hls.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b111e;
      --panel-bg: #131c2e;
      --panel-border: #1e2d4a;
      --accent: #00e5ff;
      --btn-bg: #1c2841;
      --text-main: #ffffff;
      --text-muted: #8fa3c4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px 10px 24px 10px;
      gap: 8px;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 10px;
      min-height: 0;
    }

    /* Sol Panel: Saat, Hız, Tarih & SWC */
    .left-panel {
      flex: 0.92;
      background: linear-gradient(160deg, #162238 0%, #0e1624 100%);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      min-height: 0;
    }

    .top-status {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .clock {
      font-size: clamp(1.35rem, 2.8vw, 2.1rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .gps-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.75rem, 1.2vw, 0.95rem);
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.28);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .gps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    .gps-dot.searching {
      background-color: #f1c40f;
      box-shadow: 0 0 8px #f1c40f;
    }

    /* Tam Yuvarlak Hız Halkası */
    .speed-circle {
      height: clamp(96px, 31vh, 180px);
      width: auto;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      border-radius: 50%;
      border: 4px solid rgba(0, 229, 255, 0.38);
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.16), inset 0 0 18px rgba(0, 229, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    .speed-value {
      font-size: clamp(2rem, 5.5vh, 3.5rem);
      font-weight: 800;
      line-height: 1;
    }

    .speed-unit {
      font-size: clamp(0.7rem, 1.3vh, 0.85rem);
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 2px;
      margin-top: 3px;
    }

    .bottom-info {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .date-text {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .swc-box {
      width: 100%;
      max-width: 280px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      background: rgba(0, 229, 255, 0.06);
      border-radius: 10px;
      padding: 5px 10px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sağ Panel: TV | Radyo | YouTube */
    .right-panel {
      flex: 1.38;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 8px;
      border-radius: 11px;
      border: 1px solid var(--panel-border);
      background: var(--btn-bg);
      color: var(--text-muted);
      font-size: clamp(0.8rem, 1.3vw, 0.95rem);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #06101c;
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.28);
    }

    /* Medya Kapsayıcı */
    .media-stage {
      flex: 1;
      position: relative;
      background: #070b14;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    /* CSS Tam Ekran Modu (Siyah Ekran Yapmayan Yöntem) */
    body.css-fullscreen .left-panel,
    body.css-fullscreen .tabs,
    body.css-fullscreen .bottom-controls {
      display: none !important;
    }

    body.css-fullscreen {
      padding: 0 !important;
      gap: 0 !important;
    }

    body.css-fullscreen .right-panel {
      padding: 0 !important;
      border: none !important;
      border-radius: 0 !important;
    }

    body.css-fullscreen .media-stage {
      border-radius: 0 !important;
    }

    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      background: #000;
    }

    /* Tam Ekran Butonu */
    .fs-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      background: rgba(11, 17, 30, 0.82);
      border: 1px solid rgba(0, 229, 255, 0.55);
      color: var(--accent);
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Radyo Görsel Ekranı */
    .radio-visual {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #182844 0%, #090e1a 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 8;
      text-align: center;
      padding: 16px;
    }

    .radio-visual.active {
      display: flex;
    }

    .radio-pulse {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.15);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.5); }
      70% { box-shadow: 0 0 0 18px rgba(0, 229, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
    }

    /* Bekleme Katmanı */
    .player-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1b2842 0%, #090e1a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      z-index: 6;
    }

    .player-overlay.hidden {
      display: none;
    }

    .overlay-center-icon {
      margin: auto;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.12);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .overlay-center-icon svg {
      width: 30px;
      height: 30px;
      fill: var(--accent);
      margin-left: 4px;
    }

    .live-badge {
      background: var(--accent);
      color: #05101c;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      display: inline-block;
    }

    .channel-title {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 700;
      margin-top: 3px;
    }

    .channel-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Alt Kontrol Çubuğu */
    .bottom-controls {
      height: 56px;
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr 1.4fr;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      border-radius: 13px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      font-size: clamp(0.8rem, 1.3vw, 0.95rem);
      font-weight: 600;
      padding: 5px 8px;
    }

    .ctrl-btn.play-main {
      background: var(--accent);
      color: #05101c;
      border-color: var(--accent);
    }

    .ctrl-btn.channels-btn {
      border-color: rgba(0, 229, 255, 0.45);
      color: var(--accent);
      flex-direction: column;
      gap: 2px;
      line-height: 1.1;
    }

    .ctrl-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Kanallar & M3U Yönetim Modalı */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 20, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: #e74c3c;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Yeni M3U Liste Ekleme Formu */
    .m3u-form {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(0, 0, 0, 0.18);
    }

    .m3u-row {
      display: flex;
      gap: 6px;
    }

    .m3u-form input, .m3u-form select {
      background: var(--bg-dark);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .m3u-form input { flex: 1; }

    .m3u-form button {
      background: var(--accent);
      color: #05101c;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Kayıtlı Liste Seçici Şeridi */
    .saved-playlists {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    .pl-chip {
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      cursor: pointer;
    }

    .pl-chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 229, 255, 0.12);
    }

    .pl-del {
      color: #ff6b6b;
      font-weight: bold;
      padding-left: 4px;
    }

    .channel-list {
      padding: 10px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .channel-item {
      padding: 10px 12px;
      background: var(--btn-bg);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .channel-item.active {
      border: 1px solid var(--accent);
      background: rgba(0, 229, 255, 0.14);
    }

    @media (orientation: portrait) {
      .main-container { flex-direction: column; }
      .left-panel { flex: 0.85; padding: 10px; }
      .speed-circle { height: 120px; width: 120px; }
      .speed-value { font-size: 2.3rem; }
      .right-panel { flex: 1.15; }
      .bottom-controls { height: 56px; gap: 6px; }
      .ctrl-btn.channels-btn span { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="left-panel">
      <div class="top-status">
        <div class="clock" id="clock">00:00</div>
        <div class="gps-badge">
          <span class="gps-dot searching" id="gpsDot"></span>
          <span id="gpsText">GPS Bekleniyor</span>
        </div>
      </div>

      <div class="speed-circle">
        <div class="speed-value" id="speedValue">0</div>
        <div class="speed-unit">KM/S</div>
      </div>

      <div class="bottom-info">
        <div class="date-text" id="dateText">18 Kasım 2026</div>
        <div class="swc-box" id="swcStatus">🎮 SWC: Tuş bekleniyor...</div>
      </div>
    </div>

    <div class="right-panel">
      <!-- 3 AYRI SEKME: TV | RADYO | YOUTUBE -->
      <div class="tabs">
        <button class="tab-btn active" id="tabTv" onclick="switchTab('tv')">📺 TV</button>
        <button class="tab-btn" id="tabRadio" onclick="switchTab('radio')">📻 Radyo</button>
        <button class="tab-btn" id="tabYt" onclick="switchTab('yt')">▶️ YouTube</button>
      </div>

      <div class="media-stage" id="mediaStage" ondblclick="toggleFullScreen()">
        <button class="fs-btn" id="fsBtn" onclick="toggleFullScreen()">⛶ Tam Ekran</button>

        <video id="videoPlayer" playsinline></video>
        <iframe id="ytPlayer" style="display:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>

        <!-- Radyo Çalarken Görünecek Ekran -->
        <div class="radio-visual" id="radioVisual">
          <div class="radio-pulse">📻</div>
          <div style="font-size:1.3rem; font-weight:700;" id="radioStationName">TRT FM</div>
          <div style="font-size:0.82rem; color:var(--accent);" id="radioStatusText">CANLI RADYO YAYINI</div>
        </div>

        <!-- Bekleme Katmanı -->
        <div class="player-overlay" id="playerOverlay">
          <div></div>
          <div class="overlay-center-icon" onclick="togglePlay()">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div>
            <span class="live-badge" id="badgeType">CANLI TV</span>
            <div class="channel-title" id="channelTitle">TRT 1 HD</div>
            <div class="channel-sub" id="channelSub">Başlatmak için oynat butonuna dokunun</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-controls">
    <button class="ctrl-btn" onclick="prevChannel()">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-main" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" onclick="nextChannel()">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button class="ctrl-btn channels-btn" onclick="openModal()">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      <span>Kanallar & M3U</span>
    </button>
  </div>

  <!-- İSİMLENDİRİLEBİLİR M3U & KANAL MODAL PENCERESİ -->
  <div class="modal-backdrop" id="channelModal">
    <div class="modal-card">
      <div class="modal-header">
        <strong id="modalTitle">TV Kanalları & M3U Listeleri</strong>
        <button class="close-btn" onclick="closeModal()">Kapat</button>
      </div>

      <!-- Liste Adı + Tür + Link Ekleme Alanı -->
      <div class="m3u-form">
        <div class="m3u-row">
          <input type="text" id="playlistNameInput" placeholder="Liste Adı (Örn: Spor TV, Türkü Radyo)" />
          <select id="playlistCategoryInput">
            <option value="tv">📺 TV Listesi</option>
            <option value="radio">📻 Radyo Listesi</option>
          </select>
        </div>
        <div class="m3u-row">
          <input type="text" id="m3uUrlInput" placeholder="M3U / M3U8 linkini yapıştırın..." />
          <button onclick="addNamedM3U()">Kaydet & Yükle</button>
        </div>
      </div>

      <!-- Kayıtlı Özel Listeler Şeridi -->
      <div class="saved-playlists" id="savedPlaylistsBar"></div>

      <!-- Seçili Kategorideki Kanal / İstasyon Listesi -->
      <div class="channel-list" id="channelListContainer"></div>
    </div>
  </div>

  <script>
    // Varsayılan TV ve Radyo Listeleri
    const defaultTvList = [
      { name: "TRT 1 HD", url: "https://tv-trt1.medya.trt.com.tr/master.m3u8" },
      { name: "TRT Haber HD", url: "https://tv-trthaber.medya.trt.com.tr/master.m3u8" },
      { name: "TRT Spor", url: "https://tv-trtspor1.medya.trt.com.tr/master.m3u8" },
      { name: "TRT Belgesel", url: "https://tv-trtbelgesel.medya.trt.com.tr/master.m3u8" }
    ];

    const defaultRadioList = [
      { name: "TRT FM", url: "https://trt.radyotvonline.net/trt_fm.aac" },
      { name: "TRT Türkü", url: "https://trt.radyotvonline.net/trt_turku.aac" },
      { name: "TRT Nağme", url: "https://trt.radyotvonline.net/trt_nagme.aac" },
      { name: "PowerTürk FM", url: "https://live.powerapp.com.tr/powerturk/abr/playlist.m3u8" },
      { name: "Kral Pop Radyo", url: "https://ssldyg.radyotvonline.com/smil/smil:kralpop.smil/playlist.m3u8" }
    ];

    // Kalıcı Hafıza (localStorage) Yapısı
    let playlists = JSON.parse(localStorage.getItem('seyir_playlists')) || [
      { id: 'def_tv', name: 'Varsayılan TV', category: 'tv', channels: defaultTvList },
      { id: 'def_radio', name: 'Varsayılan Radyo', category: 'radio', channels: defaultRadioList }
    ];

    let activePlaylistId = {
      tv: localStorage.getItem('seyir_active_tv') || 'def_tv',
      radio: localStorage.getItem('seyir_active_radio') || 'def_radio'
    };

    let currentIndex = { tv: 0, radio: 0 };
    let currentTab = 'tv';
    let isPlaying = false;
    let hls = null;

    const video = document.getElementById('videoPlayer');
    const ytPlayer = document.getElementById('ytPlayer');
    const overlay = document.getElementById('playerOverlay');
    const radioVisual = document.getElementById('radioVisual');

    function saveState() {
      localStorage.setItem('seyir_playlists', JSON.stringify(playlists));
      localStorage.setItem('seyir_active_tv', activePlaylistId.tv);
      localStorage.setItem('seyir_active_radio', activePlaylistId.radio);
    }

    function getCurrentChannels() {
      const cat = currentTab === 'radio' ? 'radio' : 'tv';
      const pl = playlists.find(p => p.id === activePlaylistId[cat]) || playlists.find(p => p.category === cat);
      return pl ? pl.channels : [];
    }

    // Siyah Ekran Yapmayan Tam Ekran Geçişi
    function toggleFullScreen() {
      const isFs = document.body.classList.toggle('css-fullscreen');
      document.getElementById('fsBtn').textContent = isFs ? '✕ Küçült' : '⛶ Tam Ekran';

      if (isFs) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function updateDateTime() {
      const now = new Date();
      document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
      document.getElementById('dateText').textContent = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          document.getElementById('gpsDot').classList.remove('searching');
          document.getElementById('gpsText').textContent = "GPS Aktif";
          const speedKmh = pos.coords.speed && pos.coords.speed > 0 ? Math.round(pos.coords.speed * 3.6) : 0;
          document.getElementById('speedValue').textContent = speedKmh;
        },
        () => {
          document.getElementById('gpsDot').classList.add('searching');
          document.getElementById('gpsText').textContent = "GPS Bekleniyor";
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    // Sekme Geçişi: TV | Radyo | YouTube
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabTv').classList.toggle('active', tab === 'tv');
      document.getElementById('tabRadio').classList.toggle('active', tab === 'radio');
      document.getElementById('tabYt').classList.toggle('active', tab === 'yt');

      if (tab === 'yt') {
        video.pause();
        isPlaying = false;
        video.style.display = 'none';
        overlay.classList.add('hidden');
        radioVisual.classList.remove('active');
        ytPlayer.style.display = 'block';
        if (!ytPlayer.src) ytPlayer.src = "https://www.youtube.com/embed?listType=search&list=türkçe+müzik+mix";
      } else {
        ytPlayer.style.display = 'none';
        video.style.display = 'block';
        const list = getCurrentChannels();
        const idx = currentIndex[tab] || 0;
        if (list[idx]) {
          document.getElementById('badgeType').textContent = tab === 'radio' ? 'CANLI RADYO' : 'CANLI TV';
          document.getElementById('channelTitle').textContent = list[idx].name;
          document.getElementById('radioStationName').textContent = list[idx].name;
        }
        if (tab === 'radio') {
          radioVisual.classList.add('active');
          overlay.classList.add('hidden');
        } else {
          radioVisual.classList.remove('active');
          if (!isPlaying) overlay.classList.remove('hidden');
        }
      }
    }

    function loadStream(index, autoPlay = true) {
      if (currentTab === 'yt') switchTab('tv');
      const cat = currentTab;
      const list = getCurrentChannels();
      if (!list.length) return;

      currentIndex[cat] = (index + list.length) % list.length;
      const ch = list[currentIndex[cat]];

      document.getElementById('badgeType').textContent = cat === 'radio' ? 'CANLI RADYO' : 'CANLI TV';
      document.getElementById('channelTitle').textContent = ch.name;
      document.getElementById('radioStationName').textContent = ch.name;

      if (cat === 'radio') {
        overlay.classList.add('hidden');
        radioVisual.classList.add('active');
        document.getElementById('radioStatusText').textContent = 'BAĞLANIYOR...';
      } else {
        radioVisual.classList.remove('active');
      }

      if (hls) { hls.destroy(); hls = null; }

      if (Hls.isSupported() && ch.url.includes('.m3u8')) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { if (autoPlay) playMedia(); });
      } else {
        video.src = ch.url;
        if (autoPlay) playMedia();
      }
    }

    function playMedia() {
      video.play().then(() => {
        isPlaying = true;
        overlay.classList.add('hidden');
        if (currentTab === 'radio') {
          radioVisual.classList.add('active');
          document.getElementById('radioStatusText').textContent = 'CANLI RADYO YAYINI ÇALIYOR';
        }
        document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      }).catch(() => {
        if (currentTab === 'radio') {
          document.getElementById('radioStatusText').textContent = 'Başlatmak için alttaki oynat tuşuna basın';
        } else {
          document.getElementById('channelSub').textContent = 'Oynatmak için tekrar dokunun';
        }
      });
    }

    function pauseMedia() {
      video.pause();
      isPlaying = false;
      if (currentTab === 'radio') {
        document.getElementById('radioStatusText').textContent = 'DURAKLATILDI';
      } else {
        overlay.classList.remove('hidden');
        document.getElementById('channelSub').textContent = 'Duraklatıldı';
      }
      document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
    }

    function togglePlay() {
      if (currentTab === 'yt') switchTab('tv');
      if (!video.src && !hls) { loadStream(currentIndex[currentTab], true); return; }
      isPlaying ? pauseMedia() : playMedia();
    }

    function nextChannel() { if (currentTab !== 'yt') loadStream(currentIndex[currentTab] + 1, true); }
    function prevChannel() { if (currentTab !== 'yt') loadStream(currentIndex[currentTab] - 1, true); }

    // İsimlendirilmiş M3U Listesi Ekleme
    async function addNamedM3U() {
      const nameInput = document.getElementById('playlistNameInput').value.trim();
      const cat = document.getElementById('playlistCategoryInput').value;
      const url = document.getElementById('m3uUrlInput').value.trim();

      if (!url) { alert('Lütfen M3U / M3U8 linki girin.'); return; }
      const listName = nameInput || (cat === 'radio' ? 'Özel Radyo Listesi' : 'Özel TV Listesi');

      try {
        const res = await fetch(url);
        const text = await res.text();
        const lines = text.split('\n');
        const parsed = [];
        let currentName = '';

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const commaIdx = line.lastIndexOf(',');
            currentName = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Kanal';
          } else if (line && !line.startsWith('#')) {
            parsed.push({ name: currentName || `Yayın ${parsed.length + 1}`, url: line });
            currentName = '';
          }
        }

        if (parsed.length > 0) {
          const newId = 'pl_' + Date.now();
          playlists.push({ id: newId, name: listName, category: cat, channels: parsed });
          activePlaylistId[cat] = newId;
          currentIndex[cat] = 0;
          saveState();

          document.getElementById('playlistNameInput').value = '';
          document.getElementById('m3uUrlInput').value = '';

          switchTab(cat);
          renderModalContent();
          loadStream(0, true);
        } else {
          alert('M3U linkinde geçerli yayın bulunamadı.');
        }
      } catch (e) {
        alert('Liste indirilemedi (Link hatalı veya sunucu erişime kapalı).');
      }
    }

    function selectPlaylist(id, cat) {
      activePlaylistId[cat] = id;
      currentIndex[cat] = 0;
      saveState();
      renderModalContent();
      loadStream(0, true);
    }

    function deletePlaylist(e, id, cat) {
      e.stopPropagation();
      playlists = playlists.filter(p => p.id !== id);
      if (activePlaylistId[cat] === id) {
        const fallback = playlists.find(p => p.category === cat);
        activePlaylistId[cat] = fallback ? fallback.id : '';
      }
      saveState();
      renderModalContent();
    }

    function renderModalContent() {
      const cat = currentTab === 'radio' ? 'radio' : 'tv';
      document.getElementById('modalTitle').textContent = cat === 'radio' ? 'Radyo İstasyonları & M3U Listeleri' : 'TV Kanalları & M3U Listeleri';
      document.getElementById('playlistCategoryInput').value = cat;

      // Kayıtlı Listeler Çubuğu
      const plBar = document.getElementById('savedPlaylistsBar');
      plBar.innerHTML = '';
      playlists.filter(p => p.category === cat).forEach(pl => {
        const chip = document.createElement('div');
        chip.className = `pl-chip ${pl.id === activePlaylistId[cat] ? 'active' : ''}`;
        const isDefault = pl.id.startsWith('def_');
        chip.innerHTML = `<span>${pl.name} (${pl.channels.length})</span>` +
          (!isDefault ? `<span class="pl-del" onclick="deletePlaylist(event, '${pl.id}', '${cat}')">✕</span>` : '');
        chip.onclick = () => selectPlaylist(pl.id, cat);
        plBar.appendChild(chip);
      });

      // Kanal Listesi
      const container = document.getElementById('channelListContainer');
      container.innerHTML = '';
      const list = getCurrentChannels();
      list.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = `channel-item ${idx === currentIndex[cat] ? 'active' : ''}`;
        div.innerHTML = `<span>${ch.name}</span><small style="color:var(--accent)">${cat === 'radio' ? 'RADYO' : 'CANLI TV'}</small>`;
        div.onclick = () => { loadStream(idx, true); closeModal(); };
        container.appendChild(div);
      });
    }

    function openModal() {
      if (currentTab === 'yt') switchTab('tv');
      renderModalContent();
      document.getElementById('channelModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('channelModal').classList.remove('open');
    }

    window.addEventListener('keydown', (e) => {
      document.getElementById('swcStatus').textContent = `🎮 SWC: ${e.key} (Kod: ${e.keyCode})`;
      if (e.key === 'MediaTrackNext' || e.keyCode === 176 || e.key === 'ArrowRight') nextChannel();
      else if (e.key === 'MediaTrackPrevious' || e.keyCode === 177 || e.key === 'ArrowLeft') prevChannel();
      else if (e.key === 'MediaPlayPause' || e.keyCode === 179 || e.key === ' ') { e.preventDefault(); togglePlay(); }
    });
  </script>
</body>
</html>
