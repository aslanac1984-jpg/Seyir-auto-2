<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SEYİR Auto</title>
  <script src="hls.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b111e;
      --panel-bg: #131c2e;
      --panel-border: #1e2d4a;
      --accent: #00e5ff;
      --btn-bg: #1c2841;
      --text-main: #ffffff;
      --text-muted: #8fa3c4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 10px 10px 28px 10px;
      gap: 10px;
    }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 12px;
      min-height: 0;
    }

    /* Sol Panel */
    .left-panel {
      flex: 0.95;
      background: linear-gradient(160deg, #162238 0%, #0e1624 100%);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      min-height: 0;
    }

    .top-status {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .clock {
      font-size: clamp(1.5rem, 3vw, 2.3rem);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .gps-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.8rem, 1.3vw, 1rem);
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.25);
      padding: 5px 11px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .gps-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    .gps-dot.searching {
      background-color: #f1c40f;
      box-shadow: 0 0 8px #f1c40f;
    }

    .speed-circle {
      height: clamp(110px, 34vh, 195px);
      width: auto;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      border-radius: 50%;
      border: 4px solid rgba(0, 229, 255, 0.38);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.16), inset 0 0 20px rgba(0, 229, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    .speed-value {
      font-size: clamp(2.2rem, 6vh, 3.8rem);
      font-weight: 800;
      line-height: 1;
    }

    .speed-unit {
      font-size: clamp(0.75rem, 1.4vh, 0.9rem);
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .bottom-info {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .date-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .swc-box {
      width: 100%;
      max-width: 280px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      background: rgba(0, 229, 255, 0.06);
      border-radius: 12px;
      padding: 6px 12px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sağ Panel */
    .right-panel {
      flex: 1.35;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: var(--btn-bg);
      color: var(--text-muted);
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #06101c;
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
    }

    /* Medya Kapsayıcı & Tam Ekran Modu */
    .media-stage {
      flex: 1;
      position: relative;
      background: #070b14;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .media-stage.is-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      z-index: 9999;
      background: #000;
    }

    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      background: #000;
    }

    /* Tam Ekran Butonu */
    .fs-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      background: rgba(11, 17, 30, 0.78);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: var(--accent);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Radyo Görsel Ekranı */
    .radio-visual {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #182844 0%, #090e1a 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 4;
      text-align: center;
      padding: 16px;
    }

    .radio-visual.active {
      display: flex;
    }

    .radio-pulse {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.15);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.5); }
      70% { box-shadow: 0 0 0 18px rgba(0, 229, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
    }

    /* Bekleme Katmanı */
    .player-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1b2842 0%, #090e1a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 6;
    }

    .player-overlay.hidden {
      display: none;
    }

    .overlay-center-icon {
      margin: auto;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.12);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .overlay-center-icon svg {
      width: 32px;
      height: 32px;
      fill: var(--accent);
      margin-left: 4px;
    }

    .live-badge {
      background: var(--accent);
      color: #05101c;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .channel-title {
      font-size: clamp(1.2rem, 2.2vw, 1.6rem);
      font-weight: 700;
      margin-top: 4px;
    }

    .channel-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Alt Kontrol Çubuğu */
    .bottom-controls {
      height: 60px;
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr 1.4fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      font-weight: 600;
      padding: 6px 10px;
    }

    .ctrl-btn.play-main {
      background: var(--accent);
      color: #05101c;
      border-color: var(--accent);
    }

    .ctrl-btn.channels-btn {
      border-color: rgba(0, 229, 255, 0.45);
      color: var(--accent);
      flex-direction: column;
      gap: 2px;
      line-height: 1.1;
    }

    .ctrl-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 20, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      width: 100%;
      max-width: 540px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: #e74c3c;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .m3u-input-group {
      padding: 12px 18px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--panel-border);
    }

    .m3u-input-group input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .m3u-input-group button {
      background: var(--accent);
      color: #05101c;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .channel-list {
      padding: 10px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-item {
      padding: 12px;
      background: var(--btn-bg);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .channel-item.active {
      border: 1px solid var(--accent);
      background: rgba(0, 229, 255, 0.12);
    }

    @media (orientation: portrait) {
      .main-container { flex-direction: column; }
      .left-panel { flex: 0.85; padding: 12px; }
      .speed-circle { height: 125px; width: 125px; }
      .speed-value { font-size: 2.4rem; }
      .right-panel { flex: 1.15; }
      .bottom-controls { height: 58px; gap: 6px; }
      .ctrl-btn.channels-btn span { font-size: 0.72rem; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="left-panel">
      <div class="top-status">
        <div class="clock" id="clock">00:00</div>
        <div class="gps-badge">
          <span class="gps-dot searching" id="gpsDot"></span>
          <span id="gpsText">GPS Bekleniyor</span>
        </div>
      </div>

      <div class="speed-circle">
        <div class="speed-value" id="speedValue">0</div>
        <div class="speed-unit">KM/S</div>
      </div>

      <div class="bottom-info">
        <div class="date-text" id="dateText">18 Kasım 2026</div>
        <div class="swc-box" id="swcStatus">🎮 SWC: Tuş bekleniyor...</div>
      </div>
    </div>

    <div class="right-panel">
      <div class="tabs">
        <button class="tab-btn active" id="tabTv" onclick="switchTab('tv')">📺 TV & Radyo</button>
        <button class="tab-btn" id="tabYt" onclick="switchTab('yt')">▶️ YouTube</button>
      </div>

      <div class="media-stage" id="mediaStage" ondblclick="toggleFullScreen()">
        <button class="fs-btn" id="fsBtn" onclick="toggleFullScreen()">⛶ Tam Ekran</button>

        <video id="videoPlayer" playsinline></video>
        <iframe id="ytPlayer" style="display:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>

        <!-- Radyo Çalarken Görünecek Ekran -->
        <div class="radio-visual" id="radioVisual">
          <div class="radio-pulse">📻</div>
          <div style="font-size:1.3rem; font-weight:700;" id="radioStationName">TRT FM</div>
          <div style="font-size:0.85rem; color:var(--accent);">CANLI RADYO YAYINI ÇALIYOR</div>
        </div>

        <!-- Bekleme Katmanı -->
        <div class="player-overlay" id="playerOverlay">
          <div></div>
          <div class="overlay-center-icon" onclick="togglePlay()">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <div>
            <span class="live-badge" id="badgeType">CANLI YAYIN</span>
            <div class="channel-title" id="channelTitle">TRT 1 HD</div>
            <div class="channel-sub" id="channelSub">Başlatmak için oynat butonuna dokunun</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-controls">
    <button class="ctrl-btn" onclick="prevChannel()">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-main" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" onclick="nextChannel()">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button class="ctrl-btn channels-btn" onclick="openModal()">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      <span>Kanallar & M3U</span>
    </button>
  </div>

  <div class="modal-backdrop" id="channelModal">
    <div class="modal-card">
      <div class="modal-header">
        <strong>Kanallar & M3U Listesi</strong>
        <button class="close-btn" onclick="closeModal()">Kapat</button>
      </div>
      <div class="m3u-input-group">
        <input type="text" id="m3uUrlInput" placeholder="M3U / M3U8 linki yapıştırın..." />
        <button onclick="loadM3U()">Yükle</button>
      </div>
      <div class="channel-list" id="channelListContainer"></div>
    </div>
  </div>

  <script>
    let channels = [
      { name: "TRT 1 HD", type: "CANLI YAYIN", url: "https://tv-trt1.medya.trt.com.tr/master.m3u8" },
      { name: "TRT Haber HD", type: "CANLI YAYIN", url: "https://tv-trthaber.medya.trt.com.tr/master.m3u8" },
      { name: "TRT Spor", type: "CANLI YAYIN", url: "https://tv-trtspor1.medya.trt.com.tr/master.m3u8" },
      { name: "TRT FM (Radyo)", type: "RADYO", url: "https://rd-trtfms.medya.trt.com.tr/master.m3u8" },
      { name: "Radyo 1", type: "RADYO", url: "https://rd-radyo1.medya.trt.com.tr/master.m3u8" }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let currentTab = 'tv';
    let hls = null;

    const video = document.getElementById('videoPlayer');
    const ytPlayer = document.getElementById('ytPlayer');
    const overlay = document.getElementById('playerOverlay');
    const radioVisual = document.getElementById('radioVisual');
    const mediaStage = document.getElementById('mediaStage');

    // Tam Ekran Aç / Kapat
    function toggleFullScreen() {
      const isFs = mediaStage.classList.toggle('is-fullscreen');
      document.getElementById('fsBtn').textContent = isFs ? '✕ Küçült' : '⛶ Tam Ekran';

      if (isFs) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    function updateDateTime() {
      const now = new Date();
      document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
      document.getElementById('dateText').textContent = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          document.getElementById('gpsDot').classList.remove('searching');
          document.getElementById('gpsText').textContent = "GPS Aktif";
          const speedKmh = pos.coords.speed && pos.coords.speed > 0 ? Math.round(pos.coords.speed * 3.6) : 0;
          document.getElementById('speedValue').textContent = speedKmh;
        },
        () => {
          document.getElementById('gpsDot').classList.add('searching');
          document.getElementById('gpsText').textContent = "GPS Bekleniyor";
        },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabTv').classList.toggle('active', tab === 'tv');
      document.getElementById('tabYt').classList.toggle('active', tab === 'yt');

      if (tab === 'yt') {
        video.pause();
        video.style.display = 'none';
        overlay.classList.add('hidden');
        radioVisual.classList.remove('active');
        ytPlayer.style.display = 'block';
        if (!ytPlayer.src) ytPlayer.src = "https://www.youtube.com/embed?listType=search&list=türkçe+müzik+mix";
      } else {
        ytPlayer.style.display = 'none';
        video.style.display = 'block';
        if (!isPlaying) overlay.classList.remove('hidden');
      }
    }

    function loadStream(index, autoPlay = true) {
      if (currentTab !== 'tv') switchTab('tv');
      currentIndex = (index + channels.length) % channels.length;
      const ch = channels[currentIndex];

      document.getElementById('badgeType').textContent = ch.type;
      document.getElementById('channelTitle').textContent = ch.name;
      document.getElementById('radioStationName').textContent = ch.name;
      renderChannelList();

      if (hls) { hls.destroy(); hls = null; }

      if (Hls.isSupported() && ch.url.includes('.m3u8')) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { if (autoPlay) playMedia(); });
      } else {
        video.src = ch.url;
        if (autoPlay) playMedia();
      }
    }

    function playMedia() {
      const ch = channels[currentIndex];
      video.play().then(() => {
        isPlaying = true;
        overlay.classList.add('hidden');
        if (ch.type === 'RADYO') {
          radioVisual.classList.add('active');
        } else {
          radioVisual.classList.remove('active');
        }
        document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      }).catch(() => {
        document.getElementById('channelSub').textContent = "Oynatmak için tekrar dokunun";
      });
    }

    function pauseMedia() {
      video.pause();
      isPlaying = false;
      radioVisual.classList.remove('active');
      overlay.classList.remove('hidden');
      document.getElementById('channelSub').textContent = "Duraklatıldı";
      document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
    }

    function togglePlay() {
      if (currentTab !== 'tv') switchTab('tv');
      if (!video.src && !hls) { loadStream(currentIndex, true); return; }
      isPlaying ? pauseMedia() : playMedia();
    }

    function nextChannel() { loadStream(currentIndex + 1, true); }
    function prevChannel() { loadStream(currentIndex - 1, true); }

    function renderChannelList() {
      const container = document.getElementById('channelListContainer');
      container.innerHTML = '';
      channels.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = `channel-item ${idx === currentIndex ? 'active' : ''}`;
        div.innerHTML = `<span>${ch.name}</span><small style="color:var(--accent)">${ch.type}</small>`;
        div.onclick = () => { loadStream(idx, true); closeModal(); };
        container.appendChild(div);
      });
    }

    async function loadM3U() {
      const url = document.getElementById('m3uUrlInput').value.trim();
      if (!url) return;
      try {
        const res = await fetch(url);
        const text = await res.text();
        const lines = text.split('\n');
        const parsed = [];
        let currentName = '';

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const commaIdx = line.lastIndexOf(',');
            currentName = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Kanal';
          } else if (line && !line.startsWith('#')) {
            parsed.push({ name: currentName || `Kanal ${parsed.length + 1}`, type: 'M3U YAYIN', url: line });
            currentName = '';
          }
        }

        if (parsed.length > 0) {
          channels = parsed;
          currentIndex = 0;
          renderChannelList();
          loadStream(0, true);
          closeModal();
        } else {
          alert('M3U içeriğinde geçerli yayın bulunamadı.');
        }
      } catch (e) {
        alert('Liste yüklenemedi.');
      }
    }

    function openModal() { renderChannelList(); document.getElementById('channelModal').classList.add('open'); }
    function closeModal() { document.getElementById('channelModal').classList.remove('open'); }

    window.addEventListener('keydown', (e) => {
      document.getElementById('swcStatus').textContent = `🎮 SWC: ${e.key} (Kod: ${e.keyCode})`;
      if (e.key === 'MediaTrackNext' || e.keyCode === 176 || e.key === 'ArrowRight') nextChannel();
      else if (e.key === 'MediaTrackPrevious' || e.keyCode === 177 || e.key === 'ArrowLeft') prevChannel();
      else if (e.key === 'MediaPlayPause' || e.keyCode === 179 || e.key === ' ') { e.preventDefault(); togglePlay(); }
    });

    renderChannelList();
  </script>
</body>
</html>
