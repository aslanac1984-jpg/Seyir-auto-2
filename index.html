<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SEYİR Auto - Tam Sürüm Kokpit</title>
  
  <!-- Yerel (Çevrimdışı) hls.js Kütüphanesi -->
  <script src="hls.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ÖZEL AÇILIŞ EKRANI (SPLASH SCREEN) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #131b2e 0%, #070a12 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-logo {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
      animation: pulseLogo 1.5s infinite alternate;
    }
    .splash-logo span { color: #00e5ff; }
    .splash-sub {
      margin-top: 10px;
      font-size: 16px;
      letter-spacing: 3px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .splash-loader {
      width: 240px;
      height: 4px;
      background: #1e293b;
      border-radius: 4px;
      margin-top: 28px;
      overflow: hidden;
    }
    .splash-bar {
      width: 0%;
      height: 100%;
      background: #00e5ff;
      box-shadow: 0 0 12px #00e5ff;
      animation: loadProgress 1.8s ease-out forwards;
    }
    @keyframes pulseLogo {
      from { transform: scale(0.98); }
      to { transform: scale(1.03); }
    }
    @keyframes loadProgress {
      to { width: 100%; }
    }

    /* Üst Ana Panel */
    .dashboard-main {
      flex: 1;
      display: grid;
      grid-template-columns: 0.85fr 1.35fr;
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }

    /* Sol Panel: GPS Hız, Saat & SWC Test */
    .left-card {
      background: linear-gradient(145deg, #131b2e, #0d1322);
      border: 2px solid #1e293b;
      border-radius: 24px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .top-meta {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #clock { font-size: 26px; font-weight: 700; color: #f8fafc; }
    .gps-status {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .gps-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444; }

    .speed-ring {
      width: 165px;
      height: 165px;
      border-radius: 50%;
      border: 7px solid #00e5ff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25), inset 0 0 18px rgba(0, 229, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
    }
    #speed-value { font-size: 62px; font-weight: 800; line-height: 1; }
    .speed-unit { font-size: 14px; color: #00e5ff; letter-spacing: 2px; margin-top: 4px; font-weight: 600; }
    #date { font-size: 13px; color: #64748b; margin-bottom: 6px; }

    /* Direksiyon Tuşu (SWC) Canlı Test Göstergesi */
    #swc-debug-box {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid #00e5ff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      color: #00e5ff;
      text-align: center;
      width: 100%;
      transition: all 0.2s;
    }

    /* Sağ Panel: Sekmeli Multimedya Alanı (IPTV / YouTube / Web) */
    .right-panel {
      background: #131b2e;
      border: 2px solid #1e293b;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .mode-tabs {
      display: flex;
      background: #0b0f19;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .tab-btn {
      flex: 1;
      height: 44px;
      background: #1e293b;
      color: #94a3b8;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #00e5ff;
      color: #0b0f19;
    }

    .view-container {
      flex: 1;
      position: relative;
      background: #000000;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* Görünüm 1: IPTV / Radyo */
    #view-iptv {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #media-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .media-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(11, 15, 25, 0.95));
      padding: 18px 22px 14px;
      pointer-events: none;
    }
    .media-badge {
      display: inline-block;
      background: #00e5ff;
      color: #0b0f19;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    #station-name { font-size: 22px; font-weight: 700; }
    #station-desc { font-size: 13px; color: #cbd5e1; }

    /* Görünüm 2 & 3: YouTube & Web Tarayıcı */
    #view-youtube, #view-browser {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      background: #0f172a;
    }
    .browser-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #131b2e;
      border-bottom: 1px solid #1e293b;
    }
    .url-input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid #334155;
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 15px;
      user-select: text;
    }
    .btn-go {
      background: #00e5ff;
      color: #0b0f19;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .embedded-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #ffffff;
    }

    /* Alt Sabit Medya Kontrol Çubuğu */
    .control-bar {
      height: 88px;
      background-color: #0f172a;
      border-top: 2px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 10px;
    }
    .btn-group { display: flex; gap: 10px; align-items: center; }
    .btn-control {
      height: 62px;
      min-width: 72px;
      padding: 0 16px;
      background-color: #1e293b;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-control:active { transform: scale(0.95); background-color: #334155; }
    .btn-play { background-color: #00e5ff; color: #0b0f19; min-width: 98px; font-size: 24px; }
    .btn-accent { border: 1px solid #00e5ff; color: #00e5ff; }

    /* Açılır Kanal Yönetimi & M3U Penceresi */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .drawer-box {
      background: #131b2e;
      border: 2px solid #334155;
      border-radius: 24px;
      width: 100%;
      max-width: 740px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer-header {
      padding: 16px 22px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-close {
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .drawer-body {
      padding: 18px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .m3u-controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      background: #0b0f19;
      padding: 12px;
      border-radius: 14px;
    }
    .m3u-input {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      user-select: text;
    }
    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border: 2px dashed #00e5ff;
      color: #00e5ff;
      padding: 12px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Kanal Yönetim Satırları */
    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-row {
      display: flex;
      align-items: center;
      background: #1e293b;
      border-radius: 14px;
      padding: 8px 12px;
      gap: 8px;
      border: 2px solid transparent;
    }
    .channel-row.active {
      border-color: #00e5ff;
      background: rgba(0, 229, 255, 0.12);
    }
    .channel-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      padding: 8px 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-icon {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-edit { background: #334155; color: #f8fafc; }
    .btn-del { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
  </style>
</head>
<body>

  <!-- 1. ÖZEL AÇILIŞ EKRANI (SPLASH SCREEN) -->
  <div id="splash-screen">
    <div class="splash-logo">SEYİR <span>AUTO</span></div>
    <div class="splash-sub">Akıllı Araç Multimedya Sistemi</div>
    <div class="splash-loader"><div class="splash-bar"></div></div>
  </div>

  <!-- ANA KOKPİT EKRANI -->
  <div class="dashboard-main">
    <!-- Sol: Saat, GPS, Hız ve SWC Test -->
    <div class="left-card">
      <div class="top-meta">
        <div id="clock">00:00</div>
        <div class="gps-status">
          <span class="gps-dot" id="gps-dot"></span>
          <span id="gps-text">GPS Aranıyor</span>
        </div>
      </div>

      <div class="speed-ring">
        <div id="speed-value">0</div>
        <div class="speed-unit">KM/S</div>
      </div>

      <div id="date">-- --- ----</div>

      <!-- Direksiyon Tuşu Canlı Test Kutusu -->
      <div id="swc-debug-box">
        🎮 SWC: <strong id="swc-key-output">Tuş bekleniyor...</strong>
      </div>
    </div>

    <!-- Sağ: Çoklu Mod (IPTV / YouTube / Web Tarayıcı) -->
    <div class="right-panel">
      <div class="mode-tabs">
        <button class="tab-btn active" id="tab-iptv" onclick="switchMode('iptv')">📺 TV & Radyo</button>
        <button class="tab-btn" id="tab-youtube" onclick="switchMode('youtube')">▶️ YouTube</button>
        <button class="tab-btn" id="tab-browser" onclick="switchMode('browser')">🌐 Web Tarayıcı</button>
      </div>

      <div class="view-container">
        <!-- Mod 1: IPTV / Radyo -->
        <div id="view-iptv" onclick="toggleFullscreenVideo()">
          <video id="media-player" playsinline></video>
          <div class="media-overlay">
            <span class="media-badge" id="media-source">CANLI YAYIN</span>
            <div id="station-name">TRT 1 HD</div>
            <div id="station-desc">Başlatmak için alt çubuktan oynatın</div>
          </div>
        </div>

        <!-- Mod 2: Gömülü YouTube -->
        <div id="view-youtube">
          <div class="browser-bar">
            <input type="text" id="yt-search-input" class="url-input" placeholder="YouTube'da ara veya video linki yapıştır...">
            <button class="btn-go" onclick="searchYouTube()">Ara / Aç</button>
          </div>
          <iframe id="yt-frame" class="embedded-frame" src="https://www.youtube.com/embed?listType=search&list=türkçe+yol+şarkıları" allow="autoplay; fullscreen"></iframe>
        </div>

        <!-- Mod 3: Hızlı Web Tarayıcı -->
        <div id="view-browser">
          <div class="browser-bar">
            <input type="text" id="web-url-input" class="url-input" value="https://www.google.com/webhp?igu=1" placeholder="Web adresi girin...">
            <button class="btn-go" onclick="loadWebUrl()">Git</button>
          </div>
          <iframe id="web-frame" class="embedded-frame" src="https://www.google.com/webhp?igu=1"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Alt Sabit Medya Kontrol Barı -->
  <div class="control-bar">
    <div class="btn-group">
      <button class="btn-control" onclick="prevChannel()">⏮</button>
      <button class="btn-control btn-play" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="btn-control" onclick="nextChannel()">⏭</button>
    </div>

    <div class="btn-group">
      <button class="btn-control btn-accent" onclick="openDrawer()">📺 Kanallar & M3U</button>
      <button class="btn-control" onclick="changeVolume(-0.15)">🔉</button>
      <button class="btn-control" onclick="changeVolume(0.15)">🔊</button>
    </div>
  </div>

  <!-- Kanal Listesi, Düzenleme & M3U Yükleme Penceresi -->
  <div class="drawer-backdrop" id="channel-drawer">
    <div class="drawer-box">
      <div class="drawer-header">
        <h2>Kanal Yönetimi ve M3U</h2>
        <button class="btn-close" onclick="closeDrawer()">Kapat ✕</button>
      </div>
      <div class="drawer-body">
        <label class="file-label">
          📂 Cihazdan .M3U / .M3U8 Dosyası Yükle
          <input type="file" id="m3u-file-input" accept=".m3u,.m3u8,.txt" style="display:none" onchange="handleFileUpload(event)">
        </label>

        <div class="m3u-controls">
          <input type="text" id="m3u-url-input" class="m3u-input" placeholder="M3U playlist linkini yapıştırın...">
          <button class="btn-control btn-accent" style="height: 44px; font-size: 15px;" onclick="loadM3UFromUrl()">Yükle</button>
          <button class="btn-control" style="height: 44px; font-size: 14px;" onclick="resetDefaultChannels()">Sıfırla</button>
        </div>

        <div class="channel-list" id="channel-list-container"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. AÇILIŞ EKRANI ZAMANLAYICISI
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("splash-screen").classList.add("hidden");
      }, 2000);
    });

    // 2. SEKME GEÇİŞLERİ
    function switchMode(mode) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("tab-" + mode).classList.add("active");

      document.getElementById("view-iptv").style.display = mode === "iptv" ? "flex" : "none";
      document.getElementById("view-youtube").style.display = mode === "youtube" ? "flex" : "none";
      document.getElementById("view-browser").style.display = mode === "browser" ? "flex" : "none";

      if (mode !== "iptv" && !player.paused) {
        player.pause();
        isPlaying = false;
        playBtn.innerText = "▶";
      }
    }

    function searchYouTube() {
      const query = document.getElementById("yt-search-input").value.trim();
      if (!query) return;
      const ytFrame = document.getElementById("yt-frame");
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = query.match(regExp);
      if (match && match[2].length === 11) {
        ytFrame.src = `https://www.youtube.com/embed/${match[2]}?autoplay=1`;
      } else {
        ytFrame.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}`;
      }
    }

    function loadWebUrl() {
      let url = document.getElementById("web-url-input").value.trim();
      if (!url) return;
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
        document.getElementById("web-url-input").value = url;
      }
      document.getElementById("web-frame").src = url;
    }

    // 3. KANAL YÖNETİMİ
    const defaultChannels = [
      { name: "TRT 1 HD", desc: "Canlı TV", url: "https://tv-trt1.medya.trt.com.tr/master.m3u8" },
      { name: "TRT Haber", desc: "Haber Yayını", url: "https://tv-trthaber.medya.trt.com.tr/master.m3u8" },
      { name: "TRT FM", desc: "Canlı Radyo", url: "https://rd-trtfm.medya.trt.com.tr/master_128.m3u8" },
      { name: "TRT Türkü", desc: "Canlı Radyo", url: "https://rd-trtturku.medya.trt.com.tr/master_128.m3u8" }
    ];

    let channels = JSON.parse(localStorage.getItem("seyir_channels")) || [...defaultChannels];
    let currentIndex = 0;
    let isPlaying = false;
    let hls = null;

    const player = document.getElementById("media-player");
    const playBtn = document.getElementById("play-btn");
    const descEl = document.getElementById("station-desc");

    function saveChannels() {
      localStorage.setItem("seyir_channels", JSON.stringify(channels));
    }

    function renderChannelList() {
      const container = document.getElementById("channel-list-container");
      container.innerHTML = "";
      if (channels.length === 0) {
        container.innerHTML = "<p style='color:#94a3b8; text-align:center; padding:20px;'>Listede kanal yok. M3U yükleyin veya Sıfırla'ya basın.</p>";
        return;
      }

      channels.forEach((ch, idx) => {
        const row = document.createElement("div");
        row.className = "channel-row" + (idx === currentIndex ? " active" : "");

        const title = document.createElement("div");
        title.className = "channel-title";
        title.innerText = `${idx + 1}. ${ch.name}`;
        title.onclick = () => {
          currentIndex = idx;
          switchMode("iptv");
          loadChannel(idx, true);
          closeDrawer();
        };

        const editBtn = document.createElement("button");
        editBtn.className = "btn-icon btn-edit";
        editBtn.innerText = "✏️";
        editBtn.onclick = (e) => {
          e.stopPropagation();
          editChannelName(idx);
        };

        const delBtn = document.createElement("button");
        delBtn.className = "btn-icon btn-del";
        delBtn.innerText = "🗑️";
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteChannel(idx);
        };

        row.appendChild(title);
        row.appendChild(editBtn);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    function editChannelName(idx) {
      const newName = prompt("Kanalın yeni adını girin:", channels[idx].name);
      if (newName && newName.trim() !== "") {
        channels[idx].name = newName.trim();
        saveChannels();
        renderChannelList();
        if (idx === currentIndex) {
          document.getElementById("station-name").innerText = channels[idx].name;
        }
      }
    }

    function deleteChannel(idx) {
      channels.splice(idx, 1);
      saveChannels();
      if (currentIndex >= channels.length) {
        currentIndex = Math.max(0, channels.length - 1);
      }
      renderChannelList();
    }

    function resetDefaultChannels() {
      channels = [...defaultChannels];
      currentIndex = 0;
      saveChannels();
      renderChannelList();
    }

    function parseM3U(content) {
      const lines = content.split(/\r?\n/);
      const parsed = [];
      let currentName = "Bilinmeyen Kanal";

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith("#EXTINF:")) {
          const commaIndex = line.lastIndexOf(",");
          if (commaIndex !== -1) currentName = line.substring(commaIndex + 1).trim();
        } else if (line && !line.startsWith("#") && (line.startsWith("http://") || line.startsWith("https://"))) {
          parsed.push({ name: currentName, desc: "M3U Yayını", url: line });
          currentName = "Bilinmeyen Kanal";
        }
      }
      return parsed;
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const newChannels = parseM3U(e.target.result);
        if (newChannels.length > 0) {
          channels = newChannels;
          saveChannels();
          currentIndex = 0;
          renderChannelList();
          switchMode("iptv");
          loadChannel(0, true);
          closeDrawer();
        } else {
          alert("Dosya içinde geçerli yayın linki bulunamadı.");
        }
      };
      reader.readAsText(file);
    }

    async function loadM3UFromUrl() {
      const url = document.getElementById("m3u-url-input").value.trim();
      if (!url) return;
      try {
        const res = await fetch(url);
        const text = await res.text();
        const newChannels = parseM3U(text);
        if (newChannels.length > 0) {
          channels = newChannels;
          saveChannels();
          currentIndex = 0;
          renderChannelList();
          switchMode("iptv");
          loadChannel(0, true);
          closeDrawer();
        } else {
          alert("Linkte geçerli kanal bulunamadı.");
        }
      } catch (err) {
        alert("M3U listesi indirilemedi. Linki kontrol edin.");
      }
    }

    function openDrawer() {
      renderChannelList();
      document.getElementById("channel-drawer").style.display = "flex";
    }

    function closeDrawer() {
      document.getElementById("channel-drawer").style.display = "none";
    }

    // 4. HLS OYNATMA MOTORU
    function loadChannel(index, autoPlay = false) {
      if (channels.length === 0) return;
      const ch = channels[index];
      document.getElementById("station-name").innerText = ch.name;
      descEl.innerText = "Bağlanıyor...";
      updateMediaMetadata();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (ch.url.includes(".m3u8") && typeof Hls !== "undefined" && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });
        hls.loadSource(ch.url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          descEl.innerText = ch.desc;
          if (autoPlay || isPlaying) startPlayback();
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else descEl.innerText = "Yayın şu an açılamıyor";
          }
        });
      } else {
        player.src = ch.url;
        descEl.innerText = ch.desc;
        if (autoPlay || isPlaying) startPlayback();
      }
    }

    function startPlayback() {
      player.play()
        .then(() => {
          isPlaying = true;
          playBtn.innerText = "⏸";
          descEl.innerText = "Canlı • Tam ekran için videoya dokunun";
          updateMediaMetadata();
        })
        .catch(() => {
          isPlaying = false;
          playBtn.innerText = "▶";
          descEl.innerText = "Başlatmak için oynat tuşuna basın";
        });
    }

    function togglePlay() {
      switchMode("iptv");
      if (!player.src && !hls) {
        loadChannel(currentIndex, true);
        return;
      }
      if (player.paused) startPlayback();
      else {
        player.pause();
        isPlaying = false;
        playBtn.innerText = "▶";
        descEl.innerText = "Duraklatıldı";
      }
    }

    function nextChannel() {
      if (channels.length === 0) return;
      switchMode("iptv");
      currentIndex = (currentIndex + 1) % channels.length;
      loadChannel(currentIndex, true);
    }

    function prevChannel() {
      if (channels.length === 0) return;
      switchMode("iptv");
      currentIndex = (currentIndex - 1 + channels.length) % channels.length;
      loadChannel(currentIndex, true);
    }

    function changeVolume(delta) {
      player.volume = Math.min(1, Math.max(0, player.volume + delta));
    }

    function toggleFullscreenVideo() {
      if (!document.fullscreenElement) {
        player.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    // 5. SAAT VE CANLI GPS HIZ
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText = now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
      document.getElementById("date").innerText = now.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
    }
    setInterval(updateClock, 1000);
    updateClock();

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          document.getElementById("gps-dot").style.backgroundColor = "#22c55e";
          document.getElementById("gps-text").innerText = "GPS Aktif";
          const speedMps = pos.coords.speed;
          const speedKmh = speedMps !== null && speedMps >= 0 ? Math.round(speedMps * 3.6) : 0;
          document.getElementById("speed-value").innerText = speedKmh;
        },
        () => {
          document.getElementById("gps-dot").style.backgroundColor = "#ef4444";
          document.getElementById("gps-text").innerText = "GPS Bekleniyor";
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
    }

    // 6. DİREKSİYON KUMANDASI (SWC) EŞLEŞTİRME VE TEST MODU
    const swcOutput = document.getElementById("swc-key-output");

    function logSwcSignal(source, keyName, keyCodeVal) {
      if (!swcOutput) return;
      swcOutput.innerText = `${source} | "${keyName}" (${keyCodeVal})`;
      const box = document.getElementById("swc-debug-box");
      box.style.backgroundColor = "rgba(34, 197, 94, 0.25)";
      box.style.borderColor = "#22c55e";
      box.style.color = "#ffffff";
      setTimeout(() => {
        box.style.backgroundColor = "rgba(0, 229, 255, 0.1)";
        box.style.borderColor = "#00e5ff";
        box.style.color = "#00e5ff";
      }, 600);
    }

    function updateMediaMetadata() {
      if ("mediaSession" in navigator && channels[currentIndex]) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: channels[currentIndex].name,
          artist: "SEYİR Auto",
          album: channels[currentIndex].desc || "Canlı Yayın"
        });
      }
    }

    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("nexttrack", () => {
        logSwcSignal("MediaSession", "nexttrack", "MS_NEXT");
        nextChannel();
      });
      navigator.mediaSession.setActionHandler("previoustrack", () => {
        logSwcSignal("MediaSession", "previoustrack", "MS_PREV");
        prevChannel();
      });
      navigator.mediaSession.setActionHandler("play", () => {
        logSwcSignal("MediaSession", "play", "MS_PLAY");
        if (player.paused) startPlayback();
      });
      navigator.mediaSession.setActionHandler("pause", () => {
        logSwcSignal("MediaSession", "pause", "MS_PAUSE");
        if (!player.paused) togglePlay();
      });
    }

    const SWC_KEY_MAP = {
      nextChannel: ["MediaTrackNext", "ChannelUp", "ArrowRight", "PageUp", "F7", 87, 166, 22],
      prevChannel: ["MediaTrackPrevious", "ChannelDown", "ArrowLeft", "PageDown", "F8", 88, 167, 21],
      playPause: ["MediaPlayPause", "MediaPlay", "MediaPause", "Enter", " ", 85, 126, 127, 179],
      volUp: ["AudioVolumeUp", "VolumeUp", 24, 175],
      volDown: ["AudioVolumeDown", "VolumeDown", 25, 174],
      mute: ["AudioVolumeMute", "VolumeMute", 164, 173]
    };

    window.addEventListener("keydown", (e) => {
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;

      const pressedKey = e.key;
      const pressedCode = e.keyCode;
      logSwcSignal("KeyEvent", pressedKey, pressedCode);

      const isMatch = (list) => list.includes(pressedKey) || list.includes(pressedCode);

      if (isMatch(SWC_KEY_MAP.nextChannel)) {
        e.preventDefault();
        nextChannel();
      } else if (isMatch(SWC_KEY_MAP.prevChannel)) {
        e.preventDefault();
        prevChannel();
      } else if (isMatch(SWC_KEY_MAP.playPause)) {
        e.preventDefault();
        togglePlay();
      } else if (isMatch(SWC_KEY_MAP.volUp)) {
        e.preventDefault();
        changeVolume(0.15);
      } else if (isMatch(SWC_KEY_MAP.volDown)) {
        e.preventDefault();
        changeVolume(-0.15);
      } else if (isMatch(SWC_KEY_MAP.mute)) {
        e.preventDefault();
        player.muted = !player.muted;
      }
    });
  </script>
</body>
</html>
